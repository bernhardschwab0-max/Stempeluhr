<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stempeluhr – Arbeitszeit-Rechner</title>
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icon.svg">
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#4f8cff">
<style>
  :root{
    --bg:#0f1115;
    --panel:#171a21;
    --panel2:#1e222b;
    --border:#2a2f3a;
    --text:#e8eaed;
    --muted:#8b91a1;
    --accent:#4f8cff;
    --green:#3ecf8e;
    --red:#ff5d5d;
    --weekend:#ff5d8f;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    padding:16px;
    min-height:100vh;
  }
  .wrap{max-width:760px;margin:0 auto;}
  header{
    text-align:center;
    margin-bottom:16px;
  }
  header h1{font-size:1.4rem;margin:0 0 4px;}
  header p{color:var(--muted);font-size:.85rem;margin:0;}

  .backup-bar{
    display:flex;gap:8px;justify-content:center;margin-bottom:16px;flex-wrap:wrap;
  }
  .backup-bar button{
    background:var(--panel2);border:1px solid var(--border);color:var(--text);
    padding:7px 14px;border-radius:10px;cursor:pointer;font-size:.78rem;
    display:flex;align-items:center;gap:6px;
  }
  .backup-bar button:hover{border-color:var(--accent);}

  .tabs{
    display:flex;gap:8px;justify-content:center;margin-bottom:16px;
  }
  .tab-btn{
    background:var(--panel);border:1px solid var(--border);color:var(--muted);
    padding:9px 18px;border-radius:10px;cursor:pointer;font-size:.88rem;font-weight:600;
  }
  .tab-btn.active{background:var(--accent);color:#fff;border-color:var(--accent);}
  .tab-btn:hover:not(.active){border-color:var(--accent);color:var(--text);}

  .panel{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:14px;
    padding:16px;
    margin-bottom:16px;
  }

  .today-panel{text-align:center;}
  .today-label{color:var(--muted);font-size:.85rem;margin-bottom:14px;}
  .today-btn{
    display:inline-flex;align-items:center;gap:8px;
    font-size:1.1rem;font-weight:700;
    padding:16px 34px;border-radius:16px;border:none;cursor:pointer;
    color:#fff;
  }
  .today-btn.start{background:var(--accent);}
  .today-btn.start:hover{background:#3d7ae8;}
  .today-btn.stop{background:var(--red);}
  .today-btn.stop:hover{background:#e64d4d;}
  .today-btn.secondary{background:var(--panel2);border:1px solid var(--border);color:var(--text);font-size:.85rem;padding:10px 20px;}
  .today-btn.secondary:hover{border-color:var(--accent);}
  .today-sub{margin-top:12px;font-size:1.4rem;font-weight:700;font-variant-numeric:tabular-nums;}

  .weeknav{
    display:flex;align-items:center;justify-content:space-between;gap:8px;
    margin-bottom:12px;
  }
  .weeknav button{
    background:var(--panel2);border:1px solid var(--border);color:var(--text);
    border-radius:10px;padding:8px 12px;cursor:pointer;font-size:1rem;
  }
  .weeknav button:hover{border-color:var(--accent);}
  .weeknav .weeklabel{font-weight:600;text-align:center;flex:1;font-size:.95rem;}
  .weeknav input[type=date]{
    background:var(--panel2);border:1px solid var(--border);color:var(--text);
    border-radius:8px;padding:6px;font-size:.8rem;
  }

  .soll-row{
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  }
  .soll-row label{font-size:.85rem;color:var(--muted);}
  .soll-row input[type=number]{
    width:80px;background:var(--panel2);border:1px solid var(--border);
    color:var(--text);border-radius:8px;padding:7px;font-size:.95rem;
  }

  .summary{
    display:grid;grid-template-columns:repeat(3,1fr);gap:10px;
    margin-top:14px;
  }
  .summary .box{
    background:var(--panel2);border:1px solid var(--border);border-radius:10px;
    padding:10px;text-align:center;
  }
  .summary .box .label{font-size:.7rem;color:var(--muted);margin-bottom:4px;text-transform:uppercase;letter-spacing:.03em;}
  .summary .box .value{font-size:1.15rem;font-weight:700;font-variant-numeric:tabular-nums;}
  .summary .box.diff-pos .value{color:var(--green);}
  .summary .box.diff-neg .value{color:var(--red);}

  .day-card{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:14px;
    padding:14px;
    margin-bottom:10px;
  }
  .day-card.weekend{border-color:#4a2a3a;background:#1c1620;}
  .day-card .day-head{
    display:flex;justify-content:space-between;align-items:baseline;
    margin-bottom:10px;
  }
  .day-card .day-name{font-weight:700;font-size:1rem;}
  .day-card .day-name.we{color:var(--weekend);}
  .day-card .day-date{color:var(--muted);font-size:.8rem;}

  .time-row{
    display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;
  }
  .field label{display:block;font-size:.72rem;color:var(--muted);margin-bottom:4px;}
  .field input[type=time]{
    width:100%;background:var(--panel2);border:1px solid var(--border);color:var(--text);
    border-radius:8px;padding:8px 6px;font-size:.95rem;font-variant-numeric:tabular-nums;
  }
  .field input[type=time]:focus{outline:none;border-color:var(--accent);}

  .pause-row{
    display:flex;align-items:center;gap:8px;margin-bottom:10px;font-size:.82rem;
  }
  .pause-row input[type=checkbox]{width:16px;height:16px;accent-color:var(--accent);}
  .pause-row .hint{color:var(--muted);font-size:.72rem;}

  .day-foot{
    display:flex;justify-content:space-between;border-top:1px dashed var(--border);
    padding-top:8px;font-size:.82rem;
  }
  .day-foot .k{color:var(--muted);}
  .day-foot .v{font-weight:700;font-variant-numeric:tabular-nums;}

  .empty-note{color:var(--muted);font-size:.78rem;font-style:italic;}

  .actions{
    text-align:center;margin-top:14px;
  }
  .actions button{
    background:none;border:1px solid var(--border);color:var(--muted);
    padding:8px 14px;border-radius:10px;cursor:pointer;font-size:.8rem;
  }
  .actions button:hover{color:var(--red);border-color:var(--red);}

  .year-card{margin-bottom:16px;}
  .year-head{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
  .year-title{font-size:1.1rem;font-weight:700;}
  .year-tag{font-size:.65rem;background:var(--accent);color:#fff;padding:2px 8px;border-radius:20px;font-weight:600;vertical-align:middle;margin-left:4px;}

  .month-details{margin-top:12px;}
  .month-details summary{cursor:pointer;color:var(--accent);font-size:.82rem;font-weight:600;padding:4px 0;}
  .month-table{width:100%;border-collapse:collapse;margin-top:8px;font-size:.78rem;}
  .month-table th, .month-table td{padding:6px 4px;text-align:right;border-bottom:1px solid var(--border);}
  .month-table th:first-child, .month-table td:first-child{text-align:left;color:var(--muted);}
  .month-table td.pos{color:var(--green);}
  .month-table td.neg{color:var(--red);}

  footer{text-align:center;color:var(--muted);font-size:.7rem;margin-top:20px;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>⏱ Stempeluhr</h1>
    <p>Arbeitszeit mit Sekundenerfassung</p>
  </header>

  <div class="backup-bar">
    <button id="exportBtn">⬇ Sicherung exportieren</button>
    <button id="importBtn">⬆ Sicherung importieren</button>
    <input type="file" id="importFile" accept="application/json" style="display:none;">
  </div>

  <div class="tabs">
    <button class="tab-btn active" data-tab="week">Woche</button>
    <button class="tab-btn" data-tab="year">Jahresrückblick</button>
  </div>

  <div id="viewWeek" class="view">
    <div class="panel today-panel">
      <div class="today-label" id="todayLabel"></div>
      <button class="today-btn" id="todayBtn"></button>
      <div class="today-sub" id="todaySub"></div>
    </div>

    <div class="panel">
      <div class="weeknav">
        <button id="prevWeek" title="Vorige Woche">&larr;</button>
        <div class="weeklabel" id="weekLabel"></div>
        <button id="nextWeek" title="Nächste Woche">&rarr;</button>
      </div>
      <div class="weeknav" style="margin-bottom:0;">
        <input type="date" id="weekPicker" style="flex:1;">
        <div class="soll-row" style="flex:none;">
          <label for="sollInput">Soll-Std./Woche</label>
          <input type="number" id="sollInput" min="0" step="0.5" value="40">
        </div>
      </div>

      <div class="summary">
        <div class="box"><div class="label">Soll</div><div class="value" id="sumSoll">–</div></div>
        <div class="box"><div class="label">Ist (gearbeitet)</div><div class="value" id="sumIst">–</div></div>
        <div class="box" id="sumDiffBox"><div class="label">Differenz</div><div class="value" id="sumDiff">–</div></div>
      </div>
    </div>

    <div id="days"></div>

    <div class="actions">
      <button id="resetWeek">Diese Woche zurücksetzen</button>
    </div>
  </div>

  <div id="viewYear" class="view" style="display:none;"></div>

  <footer>Alle Daten werden nur lokal in diesem Browser gespeichert. Nutze die Sicherung, um sie zu exportieren oder auf ein anderes Gerät zu übertragen.</footer>
</div>

<script>
const WEEKDAY_NAMES = ["Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag","Sonntag"];
const MONTH_NAMES = ["Jan","Feb","Mär","Apr","Mai","Jun","Jul","Aug","Sep","Okt","Nov","Dez"];
const DAY_SEC = 86400;
const WEEK_PREFIX = 'stempeluhr_week_';
const SETTINGS_KEY = 'stempeluhr_settings';

// ---------- date helpers ----------
function getMonday(d){
  const date = new Date(d);
  const day = (date.getDay() + 6) % 7; // 0=Mon
  date.setHours(0,0,0,0);
  date.setDate(date.getDate() - day);
  return date;
}
function addDays(d, n){
  const r = new Date(d);
  r.setDate(r.getDate() + n);
  return r;
}
function isoDate(d){
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const da = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${da}`;
}
function deDate(d){
  const dd = String(d.getDate()).padStart(2,'0');
  const mm = String(d.getMonth()+1).padStart(2,'0');
  return `${dd}.${mm}.${d.getFullYear()}`;
}
function weekdayIndex(d){ return (d.getDay() + 6) % 7; } // 0=Mon..6=Sun

// ---------- time helpers ----------
function timeToSec(str){
  if(!str) return null;
  const parts = str.split(':').map(Number);
  const h = parts[0]||0, m = parts[1]||0, s = parts[2]||0;
  return h*3600 + m*60 + s;
}
function nowTimeStr(){
  const d = new Date();
  return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}:${String(d.getSeconds()).padStart(2,'0')}`;
}
function secToHMS(totalSec, signed){
  let sign = '';
  let t = totalSec;
  if(signed){
    sign = t < 0 ? '−' : '+';
    t = Math.abs(t);
  } else if(t < 0){
    sign = '−'; t = Math.abs(t);
  }
  const h = Math.floor(t/3600);
  const m = Math.floor((t%3600)/60);
  const s = Math.floor(t%60);
  return `${sign}${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}

// ---------- time calculation (gross / break / net) ----------
function calcDay(startStr, endStr, pauseTaken){
  const empty = {gross:0, brk:0, net:0, hasEntry:false, breakEligible:false};
  const startSec = timeToSec(startStr);
  let endSec = timeToSec(endStr);
  if(startSec === null || endSec === null) return empty;
  if(endSec <= startSec) endSec += DAY_SEC; // crosses midnight
  const gross = endSec - startSec;
  if(gross <= 0) return empty;

  const breakEligible = gross > 6*3600;
  const brk = (breakEligible && pauseTaken) ? 1800 : 0;
  const net = gross - brk;

  return {gross, brk, net, hasEntry:true, breakEligible};
}

// ---------- state / storage ----------
function weekKey(monday){ return WEEK_PREFIX + isoDate(monday); }

function loadSettings(){
  try{
    return JSON.parse(localStorage.getItem(SETTINGS_KEY)) || {soll:40};
  }catch(e){ return {soll:40}; }
}
function saveSettings(s){
  localStorage.setItem(SETTINGS_KEY, JSON.stringify(s));
}
function loadWeek(monday){
  try{
    const raw = localStorage.getItem(weekKey(monday));
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return {days:[0,1,2,3,4,5,6].map(()=>({start:'',end:'',pause:false}))};
}
function saveWeek(monday, data){
  localStorage.setItem(weekKey(monday), JSON.stringify(data));
}
function effectiveSoll(data){
  return (data && data.soll !== undefined && data.soll !== null && !isNaN(data.soll)) ? Number(data.soll) : settings.soll;
}

let settings = loadSettings();
let currentMonday = getMonday(new Date());
let weekData = loadWeek(currentMonday);

// ---------- week view render ----------
const daysEl = document.getElementById('days');
const weekLabelEl = document.getElementById('weekLabel');
const weekPickerEl = document.getElementById('weekPicker');
const sollInputEl = document.getElementById('sollInput');

function render(){
  const sunday = addDays(currentMonday, 6);
  weekLabelEl.textContent = `${deDate(currentMonday)} – ${deDate(sunday)}`;
  weekPickerEl.value = isoDate(currentMonday);
  const soll = effectiveSoll(weekData);
  sollInputEl.value = soll;

  daysEl.innerHTML = '';
  let totalNet = 0;

  weekData.days.forEach((entry, i) => {
    const date = addDays(currentMonday, i);
    const isWeekend = i >= 5;
    const calc = calcDay(entry.start, entry.end, entry.pause);
    totalNet += calc.net;

    const card = document.createElement('div');
    card.className = 'day-card' + (isWeekend ? ' weekend' : '');

    const head = document.createElement('div');
    head.className = 'day-head';
    head.innerHTML = `<span class="day-name${isWeekend?' we':''}">${WEEKDAY_NAMES[i]}</span><span class="day-date">${deDate(date)}</span>`;
    card.appendChild(head);

    const timeRow = document.createElement('div');
    timeRow.className = 'time-row';
    timeRow.innerHTML = `
      <div class="field">
        <label>Start</label>
        <input type="time" step="1" value="${entry.start||''}" data-idx="${i}" data-field="start">
      </div>
      <div class="field">
        <label>Ende</label>
        <input type="time" step="1" value="${entry.end||''}" data-idx="${i}" data-field="end">
      </div>`;
    card.appendChild(timeRow);

    const pauseRow = document.createElement('div');
    pauseRow.className = 'pause-row';
    const disabled = !calc.breakEligible ? 'disabled' : '';
    pauseRow.innerHTML = `
      <input type="checkbox" id="pause${i}" data-idx="${i}" data-field="pause" ${entry.pause?'checked':''} ${disabled}>
      <label for="pause${i}">Pause gemacht (30 Min)</label>
      <span class="hint">${calc.hasEntry ? (calc.breakEligible ? '' : '(erst ab 6h Pflicht)') : ''}</span>
    `;
    card.appendChild(pauseRow);

    if(calc.hasEntry){
      const foot = document.createElement('div');
      foot.className = 'day-foot';
      foot.innerHTML = `
        <span><span class="k">Brutto</span> <span class="v">${secToHMS(calc.gross)}</span></span>
        <span><span class="k">Pause</span> <span class="v">${secToHMS(calc.brk)}</span></span>
        <span><span class="k">Netto</span> <span class="v">${secToHMS(calc.net)}</span></span>
      `;
      card.appendChild(foot);
    } else {
      const note = document.createElement('div');
      note.className = 'empty-note';
      note.textContent = 'Kein Eintrag';
      card.appendChild(note);
    }

    daysEl.appendChild(card);
  });

  // bind inputs
  daysEl.querySelectorAll('input').forEach(inp => {
    inp.addEventListener('input', onFieldChange);
    inp.addEventListener('change', onFieldChange);
  });

  // summary
  const sollSec = soll * 3600;
  const diffSec = totalNet - sollSec;
  document.getElementById('sumSoll').textContent = secToHMS(sollSec);
  document.getElementById('sumIst').textContent = secToHMS(totalNet);
  const diffBox = document.getElementById('sumDiffBox');
  const diffEl = document.getElementById('sumDiff');
  diffEl.textContent = secToHMS(diffSec, true);
  diffBox.classList.remove('diff-pos','diff-neg');
  diffBox.classList.add(diffSec >= 0 ? 'diff-pos' : 'diff-neg');
}

function onFieldChange(e){
  const idx = Number(e.target.dataset.idx);
  const field = e.target.dataset.field;
  if(field === 'pause'){
    weekData.days[idx].pause = e.target.checked;
  } else {
    weekData.days[idx][field] = e.target.value;
  }
  saveWeek(currentMonday, weekData);
  render();
  renderToday();
}

// ---------- week nav ----------
document.getElementById('prevWeek').addEventListener('click', () => {
  currentMonday = addDays(currentMonday, -7);
  weekData = loadWeek(currentMonday);
  render();
});
document.getElementById('nextWeek').addEventListener('click', () => {
  currentMonday = addDays(currentMonday, 7);
  weekData = loadWeek(currentMonday);
  render();
});
weekPickerEl.addEventListener('change', () => {
  const picked = new Date(weekPickerEl.value + 'T00:00:00');
  if(isNaN(picked)) return;
  currentMonday = getMonday(picked);
  weekData = loadWeek(currentMonday);
  render();
});
sollInputEl.addEventListener('input', () => {
  const v = parseFloat(sollInputEl.value);
  const val = isNaN(v) ? 0 : v;
  weekData.soll = val;
  settings.soll = val;
  saveWeek(currentMonday, weekData);
  saveSettings(settings);
  render();
});
document.getElementById('resetWeek').addEventListener('click', () => {
  if(!confirm('Alle Einträge dieser Woche wirklich löschen?')) return;
  weekData = {days:[0,1,2,3,4,5,6].map(()=>({start:'',end:'',pause:false})), soll: settings.soll};
  saveWeek(currentMonday, weekData);
  render();
  renderToday();
});

// ---------- today start/stop button ----------
const todayBtnEl = document.getElementById('todayBtn');
const todayLabelEl = document.getElementById('todayLabel');
const todaySubEl = document.getElementById('todaySub');
let todayTimer = null;

function getOpenEntry(){
  const today = new Date();
  const yesterday = addDays(today, -1);
  for(const d of [yesterday, today]){
    const monday = getMonday(d);
    const idx = weekdayIndex(d);
    const data = loadWeek(monday);
    const e = data.days[idx];
    if(e && e.start && !e.end){
      return {monday, index:idx, date:d, data};
    }
  }
  return null;
}

function startDay(){
  const today = new Date();
  const monday = getMonday(today);
  const idx = weekdayIndex(today);
  const data = loadWeek(monday);
  data.days[idx].start = nowTimeStr();
  saveWeek(monday, data);
  currentMonday = monday;
  weekData = data;
  render();
  renderToday();
}

function endDay(open){
  const data = loadWeek(open.monday);
  data.days[open.index].end = nowTimeStr();
  saveWeek(open.monday, data);
  currentMonday = open.monday;
  weekData = data;
  render();
  renderToday();
}

function renderToday(){
  if(todayTimer){ clearInterval(todayTimer); todayTimer = null; }
  const open = getOpenEntry();

  if(open){
    const today = new Date();
    const dayLabel = isoDate(open.date) === isoDate(today) ? 'Heute' : 'Gestern';
    todayLabelEl.textContent = `${dayLabel} gestartet um ${open.data.days[open.index].start} Uhr`;
    todayBtnEl.textContent = '⏹ Tag beenden';
    todayBtnEl.className = 'today-btn stop';
    todayBtnEl.onclick = () => endDay(open);

    const base = new Date(open.date);
    base.setHours(0,0,0,0);
    const startMs = base.getTime() + timeToSec(open.data.days[open.index].start) * 1000;
    const tick = () => {
      const elapsed = Math.max(0, Math.floor((Date.now() - startMs) / 1000));
      todaySubEl.textContent = secToHMS(elapsed);
    };
    tick();
    todayTimer = setInterval(tick, 1000);
  } else {
    const today = new Date();
    const monday = getMonday(today);
    const idx = weekdayIndex(today);
    const data = loadWeek(monday);
    const e = data.days[idx];

    if(e && e.start && e.end){
      todayLabelEl.textContent = `Heute erfasst: ${e.start} – ${e.end} Uhr`;
      todaySubEl.textContent = '';
      todayBtnEl.textContent = '↻ Neu erfassen';
      todayBtnEl.className = 'today-btn secondary';
      todayBtnEl.onclick = () => {
        if(!confirm('Heutigen Eintrag wirklich zurücksetzen und neu starten?')) return;
        e.start = ''; e.end = ''; e.pause = false;
        saveWeek(monday, data);
        if(isoDate(currentMonday) === isoDate(monday)){ weekData = data; render(); }
        renderToday();
      };
    } else {
      todayLabelEl.textContent = 'Noch kein Eintrag für heute';
      todaySubEl.textContent = '';
      todayBtnEl.textContent = '▶ Tag starten';
      todayBtnEl.className = 'today-btn start';
      todayBtnEl.onclick = startDay;
    }
  }
}

// ---------- year review ----------
function getAllWeeksFromStorage(){
  const weeks = [];
  for(let i=0;i<localStorage.length;i++){
    const key = localStorage.key(i);
    if(!key || !key.startsWith(WEEK_PREFIX)) continue;
    const dateStr = key.substring(WEEK_PREFIX.length);
    const monday = new Date(dateStr + 'T00:00:00');
    if(isNaN(monday)) continue;
    let data;
    try{ data = JSON.parse(localStorage.getItem(key)); }catch(e){ continue; }
    if(!data || !Array.isArray(data.days)) continue;
    weeks.push({monday, data});
  }
  return weeks;
}

function computeYearStats(years){
  const stats = {};
  years.forEach(y => stats[y] = {
    netSec:0, sollSec:0,
    weekDaysCount:0,
    months: Array.from({length:12}, () => ({netSec:0, sollSec:0}))
  });
  const yearSet = new Set(years);
  const weeks = getAllWeeksFromStorage();

  weeks.forEach(({monday, data}) => {
    const soll = effectiveSoll(data);
    const dailySollSec = (soll || 0) * 3600 / 7;
    data.days.forEach((entry, i) => {
      const date = addDays(monday, i);
      const y = date.getFullYear();
      if(!yearSet.has(y)) return;
      const s = stats[y];
      s.weekDaysCount++;
      s.sollSec += dailySollSec;
      s.months[date.getMonth()].sollSec += dailySollSec;
      const calc = calcDay(entry.start, entry.end, entry.pause);
      if(calc.hasEntry){
        s.netSec += calc.net;
        s.months[date.getMonth()].netSec += calc.net;
      }
    });
  });
  return stats;
}

function renderYearView(){
  const yearViewEl = document.getElementById('viewYear');
  const currentYear = new Date().getFullYear();
  const years = [currentYear, currentYear-1, currentYear-2];
  const stats = computeYearStats(years);

  yearViewEl.innerHTML = '';
  years.forEach(y => {
    const s = stats[y];
    const card = document.createElement('div');
    card.className = 'panel year-card';

    if(s.weekDaysCount === 0){
      card.innerHTML = `
        <div class="year-head"><span class="year-title">${y}${y===currentYear?'<span class="year-tag">aktuell</span>':''}</span></div>
        <p class="empty-note">Keine Daten für dieses Jahr erfasst.</p>`;
      yearViewEl.appendChild(card);
      return;
    }

    const diffSec = s.netSec - s.sollSec;
    let monthRows = '';
    s.months.forEach((m, idx) => {
      if(m.sollSec === 0 && m.netSec === 0) return;
      const md = m.netSec - m.sollSec;
      monthRows += `<tr><td>${MONTH_NAMES[idx]}</td><td>${secToHMS(m.netSec)}</td><td>${secToHMS(m.sollSec)}</td><td class="${md>=0?'pos':'neg'}">${secToHMS(md,true)}</td></tr>`;
    });

    card.innerHTML = `
      <div class="year-head"><span class="year-title">${y}${y===currentYear?'<span class="year-tag">aktuell</span>':''}</span></div>
      <div class="summary">
        <div class="box"><div class="label">Soll</div><div class="value">${secToHMS(s.sollSec)}</div></div>
        <div class="box"><div class="label">Ist</div><div class="value">${secToHMS(s.netSec)}</div></div>
        <div class="box ${diffSec>=0?'diff-pos':'diff-neg'}"><div class="label">Differenz</div><div class="value">${secToHMS(diffSec,true)}</div></div>
      </div>
      <details class="month-details">
        <summary>Monatsübersicht</summary>
        <table class="month-table">
          <thead><tr><th>Monat</th><th>Ist</th><th>Soll</th><th>Diff.</th></tr></thead>
          <tbody>${monthRows || '<tr><td colspan="4" class="empty-note">Keine Monatsdaten</td></tr>'}</tbody>
        </table>
      </details>
    `;
    yearViewEl.appendChild(card);
  });
}

// ---------- tabs ----------
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const tab = btn.dataset.tab;
    document.getElementById('viewWeek').style.display = tab === 'week' ? '' : 'none';
    document.getElementById('viewYear').style.display = tab === 'year' ? '' : 'none';
    if(tab === 'year') renderYearView();
  });
});

// ---------- backup (export / import) ----------
document.getElementById('exportBtn').addEventListener('click', () => {
  const backup = {version:1, exportedAt: new Date().toISOString(), settings, weeks:{}};
  for(let i=0;i<localStorage.length;i++){
    const key = localStorage.key(i);
    if(key && key.startsWith(WEEK_PREFIX)){
      try{ backup.weeks[key] = JSON.parse(localStorage.getItem(key)); }catch(e){}
    }
  }
  const blob = new Blob([JSON.stringify(backup, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `stempeluhr-sicherung-${isoDate(new Date())}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
});

const importFileEl = document.getElementById('importFile');
document.getElementById('importBtn').addEventListener('click', () => importFileEl.click());
importFileEl.addEventListener('change', (e) => {
  const file = e.target.files[0];
  e.target.value = '';
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    let backup;
    try{ backup = JSON.parse(reader.result); }
    catch(err){ alert('Ungültige Sicherungsdatei.'); return; }
    if(!backup || typeof backup !== 'object' || typeof backup.weeks !== 'object'){
      alert('Ungültige Sicherungsdatei.');
      return;
    }
    if(!confirm('Bestehende lokale Daten werden durch diese Sicherung ersetzt. Fortfahren?')) return;

    Object.keys(localStorage)
      .filter(k => k.startsWith(WEEK_PREFIX) || k === SETTINGS_KEY)
      .forEach(k => localStorage.removeItem(k));

    if(backup.settings) saveSettings(backup.settings);
    Object.entries(backup.weeks).forEach(([key, value]) => {
      if(key.startsWith(WEEK_PREFIX)) localStorage.setItem(key, JSON.stringify(value));
    });

    settings = loadSettings();
    weekData = loadWeek(currentMonday);
    render();
    renderToday();
    if(document.getElementById('viewYear').style.display !== 'none') renderYearView();
    alert('Sicherung erfolgreich importiert.');
  };
  reader.readAsText(file);
});

render();
renderToday();
</script>
