<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stempeluhr – Arbeitszeit-Rechner</title>
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icon.svg">
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#4f8cff">
<style>
  :root{
    --bg:#0f1115;
    --panel:#171a21;
    --panel2:#1e222b;
    --border:#2a2f3a;
    --text:#e8eaed;
    --muted:#8b91a1;
    --accent:#4f8cff;
    --green:#3ecf8e;
    --red:#ff5d5d;
    --sonntag:#ffa94f;
    --vacation:#3ecf8e;
    --za:#8b7bf0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    padding:16px;
    min-height:100vh;
  }
  .wrap{max-width:760px;margin:0 auto;}
  header{
    text-align:center;
    margin-bottom:16px;
  }
  header h1{font-size:1.4rem;margin:0 0 4px;}
  header p{color:var(--muted);font-size:.85rem;margin:0;}

  .backup-bar{
    display:flex;gap:8px;justify-content:center;margin-bottom:16px;flex-wrap:wrap;
  }
  .backup-bar button{
    background:var(--panel2);border:1px solid var(--border);color:var(--text);
    padding:7px 14px;border-radius:10px;cursor:pointer;font-size:.78rem;
    display:flex;align-items:center;gap:6px;
  }
  .backup-bar button:hover{border-color:var(--accent);}

  .tabs{
    display:flex;gap:6px;justify-content:center;margin-bottom:16px;flex-wrap:wrap;
  }
  .tab-btn{
    background:var(--panel);border:1px solid var(--border);color:var(--muted);
    padding:8px 14px;border-radius:10px;cursor:pointer;font-size:.82rem;font-weight:600;
  }
  .tab-btn.active{background:var(--accent);color:#fff;border-color:var(--accent);}
  .tab-btn:hover:not(.active){border-color:var(--accent);color:var(--text);}

  .panel{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:14px;
    padding:16px;
    margin-bottom:16px;
  }

  .today-panel{text-align:center;}
  .today-label{color:var(--muted);font-size:.85rem;margin-bottom:14px;}
  .today-btn{
    display:inline-flex;align-items:center;gap:8px;
    font-size:1.1rem;font-weight:700;
    padding:16px 34px;border-radius:16px;border:none;cursor:pointer;
    color:#fff;
  }
  .today-btn.start{background:var(--accent);}
  .today-btn.start:hover{background:#3d7ae8;}
  .today-btn.stop{background:var(--red);}
  .today-btn.stop:hover{background:#e64d4d;}
  .today-btn.secondary{background:var(--panel2);border:1px solid var(--border);color:var(--text);font-size:.85rem;padding:10px 20px;}
  .today-btn.secondary:hover{border-color:var(--accent);}
  .today-btn:disabled{opacity:.5;cursor:not-allowed;}
  .today-sub{margin-top:12px;font-size:1.4rem;font-weight:700;font-variant-numeric:tabular-nums;}

  .weeknav{
    display:flex;align-items:center;justify-content:space-between;gap:8px;
    margin-bottom:12px;
  }
  .weeknav button{
    background:var(--panel2);border:1px solid var(--border);color:var(--text);
    border-radius:10px;padding:8px 12px;cursor:pointer;font-size:1rem;
  }
  .weeknav button:hover{border-color:var(--accent);}
  .weeknav .weeklabel{font-weight:600;text-align:center;flex:1;font-size:.95rem;}
  .weeknav input[type=date]{
    background:var(--panel2);border:1px solid var(--border);color:var(--text);
    border-radius:8px;padding:6px;font-size:.8rem;
  }

  .soll-row{
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  }
  .soll-row label{font-size:.85rem;color:var(--muted);}
  .soll-row input[type=number]{
    width:80px;background:var(--panel2);border:1px solid var(--border);
    color:var(--text);border-radius:8px;padding:7px;font-size:.95rem;
  }

  .summary{
    display:grid;grid-template-columns:repeat(3,1fr);gap:10px;
    margin-top:14px;
  }
  .summary.grid2{grid-template-columns:repeat(2,1fr);}
  .summary .box{
    background:var(--panel2);border:1px solid var(--border);border-radius:10px;
    padding:10px;text-align:center;
  }
  .summary .box .label{font-size:.7rem;color:var(--muted);margin-bottom:4px;text-transform:uppercase;letter-spacing:.03em;}
  .summary .box .value{font-size:1.15rem;font-weight:700;font-variant-numeric:tabular-nums;}
  .summary .box.diff-pos .value{color:var(--green);}
  .summary .box.diff-neg .value{color:var(--red);}

  .day-card{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:14px;
    padding:14px;
    margin-bottom:10px;
  }
  .day-card.sonntag{border-color:#4a3a2a;background:#211a12;}
  .day-card.absence{display:flex;align-items:center;justify-content:space-between;gap:12px;}
  .day-card.absence.urlaub{border-color:#1f4a3a;background:#122019;}
  .day-card.absence.za{border-color:#3a2f5c;background:#191527;}
  .day-card .day-head{
    display:flex;justify-content:space-between;align-items:baseline;
    margin-bottom:10px;
  }
  .day-card .day-name{font-weight:700;font-size:1rem;}
  .day-card .day-name.so{color:var(--sonntag);}
  .day-card .day-date{color:var(--muted);font-size:.8rem;}

  .badge{display:inline-block;font-size:.68rem;font-weight:700;padding:4px 10px;border-radius:20px;white-space:nowrap;}
  .badge.sonntag{background:rgba(255,169,79,.15);color:var(--sonntag);}
  .badge.urlaub{background:rgba(62,207,142,.15);color:var(--vacation);}
  .badge.za{background:rgba(139,123,240,.15);color:var(--za);}

  .time-row{
    display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;
  }
  .field label{display:block;font-size:.72rem;color:var(--muted);margin-bottom:4px;}
  .field input[type=time], .field input[type=date], .field input[type=text], .field input[type=number], .field select{
    width:100%;background:var(--panel2);border:1px solid var(--border);color:var(--text);
    border-radius:8px;padding:8px 6px;font-size:.95rem;font-variant-numeric:tabular-nums;
  }
  .field input:focus, .field select:focus{outline:none;border-color:var(--accent);}

  .time-display{
    width:100%;background:var(--panel2);border:1px solid var(--border);color:var(--text);
    border-radius:8px;padding:8px 6px;font-size:.95rem;font-variant-numeric:tabular-nums;
    text-align:left;cursor:pointer;font-family:inherit;
  }
  .time-display.placeholder{color:var(--muted);}
  .time-display:hover{border-color:var(--accent);}

  .modal-backdrop{
    position:fixed;inset:0;background:rgba(0,0,0,.6);
    display:flex;align-items:center;justify-content:center;z-index:1000;padding:20px;
  }
  .time-modal{
    background:var(--panel);border:1px solid var(--border);border-radius:16px;
    padding:20px;width:100%;max-width:320px;
  }
  .time-modal h3{margin:0 0 16px;font-size:1rem;text-align:center;}
  .time-modal .time-select-row{display:flex;align-items:center;justify-content:center;gap:6px;margin-bottom:20px;}
  .time-modal select{
    background:var(--panel2);border:1px solid var(--border);color:var(--text);
    border-radius:8px;padding:10px 6px;font-size:1.3rem;font-variant-numeric:tabular-nums;text-align:center;
  }
  .time-modal .time-sep{font-size:1.3rem;font-weight:700;color:var(--muted);}
  .time-modal .time-modal-actions{display:flex;gap:10px;}
  .time-modal .time-modal-actions button{flex:1;padding:12px;border-radius:10px;border:none;cursor:pointer;font-weight:700;font-size:.95rem;}
  .time-modal .btn-ok{background:var(--accent);color:#fff;}
  .time-modal .btn-ok:hover{background:#3d7ae8;}
  .time-modal .btn-cancel{background:var(--panel2);border:1px solid var(--border);color:var(--text);}
  .time-modal .btn-cancel:hover{border-color:var(--red);color:var(--red);}

  .pause-row{
    display:flex;align-items:center;gap:8px;margin-bottom:10px;font-size:.82rem;
  }
  .pause-row input[type=checkbox]{width:16px;height:16px;accent-color:var(--accent);}
  .pause-row .hint{color:var(--muted);font-size:.72rem;}

  .day-foot{
    display:flex;justify-content:space-between;border-top:1px dashed var(--border);
    padding-top:8px;font-size:.82rem;
  }
  .day-foot .k{color:var(--muted);}
  .day-foot .v{font-weight:700;font-variant-numeric:tabular-nums;}

  .empty-note{color:var(--muted);font-size:.78rem;font-style:italic;}

  .actions{
    text-align:center;margin-top:14px;
  }
  .actions button{
    background:none;border:1px solid var(--border);color:var(--muted);
    padding:8px 14px;border-radius:10px;cursor:pointer;font-size:.8rem;
  }
  .actions button:hover{color:var(--red);border-color:var(--red);}

  .year-card{margin-bottom:16px;}
  .year-head{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
  .year-title{font-size:1.1rem;font-weight:700;}
  .year-tag{font-size:.65rem;background:var(--accent);color:#fff;padding:2px 8px;border-radius:20px;font-weight:600;vertical-align:middle;margin-left:4px;}

  .month-details{margin-top:12px;}
  .month-details summary{cursor:pointer;color:var(--accent);font-size:.82rem;font-weight:600;padding:4px 0;}
  .month-table{width:100%;border-collapse:collapse;margin-top:8px;font-size:.78rem;}
  .month-table th, .month-table td{padding:6px 4px;text-align:right;border-bottom:1px solid var(--border);}
  .month-table th:first-child, .month-table td:first-child{text-align:left;color:var(--muted);}
  .month-table td.pos{color:var(--green);}
  .month-table td.neg{color:var(--red);}

  footer{text-align:center;color:var(--muted);font-size:.7rem;margin-top:20px;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>⏱ Stempeluhr</h1>
    <p>Arbeitszeit mit Sekundenerfassung</p>
  </header>

  <div class="backup-bar">
    <button id="exportBtn">⬇ Sicherung exportieren</button>
    <button id="importBtn">⬆ Sicherung importieren</button>
    <input type="file" id="importFile" accept="application/json" style="display:none;">
  </div>

  <div class="tabs">
    <button class="tab-btn active" data-tab="week">Woche</button>
    <button class="tab-btn" data-tab="ueberstunden">Überstunden</button>
    <button class="tab-btn" data-tab="urlaub">Urlaub</button>
    <button class="tab-btn" data-tab="year">Jahresrückblick</button>
  </div>

  <div id="viewWeek" class="view">
    <div class="panel today-panel">
      <div class="today-label" id="todayLabel"></div>
      <button class="today-btn" id="todayBtn"></button>
      <div class="today-sub" id="todaySub"></div>
    </div>

    <div class="panel">
      <div class="weeknav">
        <button id="prevWeek" title="Vorige Woche">&larr;</button>
        <div class="weeklabel" id="weekLabel"></div>
        <button id="nextWeek" title="Nächste Woche">&rarr;</button>
      </div>
      <div class="weeknav" style="margin-bottom:12px;">
        <input type="date" id="weekPicker" style="flex:1;">
        <div class="soll-row" style="flex:none;">
          <label for="sollInput">Soll-Std./Woche</label>
          <input type="number" id="sollInput" min="0" step="0.01" value="40">
        </div>
      </div>
      <div class="soll-row" style="margin-bottom:0;">
        <label for="bezahltePauseInput">Bezahlte Pause/Tag (Min)</label>
        <input type="number" id="bezahltePauseInput" min="0" step="5" value="15">
      </div>

      <div class="summary grid2">
        <div class="box">
          <div class="label">Soll (Mo–Sa)</div>
          <div class="value" id="sumSoll">–</div>
          <div id="sollHint" style="font-size:.68rem;color:var(--muted);margin-top:2px;"></div>
        </div>
        <div class="box"><div class="label">Ist (Mo–Sa)</div><div class="value" id="sumIst">–</div></div>
        <div class="box" id="sumDiffBox"><div class="label">Differenz</div><div class="value" id="sumDiff">–</div></div>
        <div class="box"><div class="label">Überstunden (So)</div><div class="value" id="sumSonntag">–</div></div>
      </div>
    </div>

    <div id="days"></div>

    <div class="actions">
      <button id="resetWeek">Diese Woche zurücksetzen</button>
    </div>
  </div>

  <div id="viewUeberstunden" class="view" style="display:none;"></div>
  <div id="viewUrlaub" class="view" style="display:none;"></div>
  <div id="viewYear" class="view" style="display:none;"></div>

  <footer>Alle Daten werden nur lokal in diesem Browser gespeichert. Nutze die Sicherung, um sie zu exportieren oder auf ein anderes Gerät zu übertragen.</footer>
</div>

<script>
const WEEKDAY_NAMES = ["Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag","Sonntag"];
const MONTH_NAMES = ["Jan","Feb","Mär","Apr","Mai","Jun","Jul","Aug","Sep","Okt","Nov","Dez"];
const DAY_SEC = 86400;
const WEEK_PREFIX = 'stempeluhr_week_';
const SETTINGS_KEY = 'stempeluhr_settings';
const ABSENCES_KEY = 'stempeluhr_absences_v1';
const DEFAULT_SETTINGS = {soll:40, pauschale:10, urlaubTage:30, bezahltePause:15};

// ---------- date helpers ----------
function getMonday(d){
  const date = new Date(d);
  const day = (date.getDay() + 6) % 7; // 0=Mon
  date.setHours(0,0,0,0);
  date.setDate(date.getDate() - day);
  return date;
}
function addDays(d, n){
  const r = new Date(d);
  r.setDate(r.getDate() + n);
  return r;
}
function isoDate(d){
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const da = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${da}`;
}
function deDate(d){
  const dd = String(d.getDate()).padStart(2,'0');
  const mm = String(d.getMonth()+1).padStart(2,'0');
  return `${dd}.${mm}.${d.getFullYear()}`;
}
function weekdayIndex(d){ return (d.getDay() + 6) % 7; } // 0=Mon..6=Sun

// ---------- time helpers ----------
function timeToSec(str){
  if(!str) return null;
  const parts = str.split(':').map(Number);
  const h = parts[0]||0, m = parts[1]||0, s = parts[2]||0;
  return h*3600 + m*60 + s;
}
function nowTimeStr(){
  const d = new Date();
  return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}:${String(d.getSeconds()).padStart(2,'0')}`;
}
function secToHMS(totalSec, signed){
  let sign = '';
  let t = Math.round(totalSec); // Gleitkomma-Rundungsfehler (z.B. 40/6*3600) glätten
  if(signed){
    sign = t < 0 ? '−' : '+';
    t = Math.abs(t);
  } else if(t < 0){
    sign = '−'; t = Math.abs(t);
  }
  const h = Math.floor(t/3600);
  const m = Math.floor((t%3600)/60);
  const s = Math.floor(t%60);
  return `${sign}${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}
function tage(n){ return `${n} Tag${n===1?'':'e'}`; }
function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ---------- eigenes Zeit-Auswahlfenster (schließt & speichert nur per OK, nie durch Fokusverlust) ----------
function openTimePicker(title, currentValue, onConfirm){
  const parts = (currentValue||'00:00:00').split(':').map(v => parseInt(v,10)||0);
  const [ch, cm, cs] = [parts[0]||0, parts[1]||0, parts[2]||0];

  const opts = (max) => Array.from({length:max}, (_,i) => String(i).padStart(2,'0'))
    .map(v => `<option value="${v}">${v}</option>`).join('');

  const backdrop = document.createElement('div');
  backdrop.className = 'modal-backdrop';
  const modal = document.createElement('div');
  modal.className = 'time-modal';
  modal.innerHTML = `
    <h3>${escapeHtml(title)}</h3>
    <div class="time-select-row">
      <select id="tpH">${opts(24)}</select>
      <span class="time-sep">:</span>
      <select id="tpM">${opts(60)}</select>
      <span class="time-sep">:</span>
      <select id="tpS">${opts(60)}</select>
    </div>
    <div class="time-modal-actions">
      <button type="button" class="btn-cancel">Abbrechen</button>
      <button type="button" class="btn-ok">OK</button>
    </div>
  `;
  backdrop.appendChild(modal);
  document.body.appendChild(backdrop);

  const hSel = modal.querySelector('#tpH');
  const mSel = modal.querySelector('#tpM');
  const sSel = modal.querySelector('#tpS');
  hSel.value = String(ch).padStart(2,'0');
  mSel.value = String(cm).padStart(2,'0');
  sSel.value = String(cs).padStart(2,'0');

  // Bewusst kein Schließen per Backdrop-Klick oder Escape:
  // das Fenster soll ausschließlich über OK/Abbrechen geschlossen werden.
  function close(){ document.body.removeChild(backdrop); }
  modal.querySelector('.btn-cancel').addEventListener('click', close);
  modal.querySelector('.btn-ok').addEventListener('click', () => {
    const val = `${hSel.value}:${mSel.value}:${sSel.value}`;
    close();
    onConfirm(val);
  });
}

// ---------- time calculation (gross / break / work / paid break / net) ----------
// "net" (Ist) = tatsächlich gearbeitete Zeit + bezahlte Pause obendrauf (nicht davon abgezogen) –
// die bezahlte Pause wird nicht real genommen, sondern zusätzlich zur geleisteten Zeit gutgeschrieben.
function calcDay(startStr, endStr, pauseTaken){
  const empty = {gross:0, brk:0, work:0, paidBreak:0, net:0, hasEntry:false, breakEligible:false};
  const startSec = timeToSec(startStr);
  let endSec = timeToSec(endStr);
  if(startSec === null || endSec === null) return empty;
  if(endSec <= startSec) endSec += DAY_SEC; // crosses midnight
  const gross = endSec - startSec;
  if(gross <= 0) return empty;

  const breakEligible = gross > 6*3600;
  const brk = (breakEligible && pauseTaken) ? 1800 : 0;
  const work = gross - brk;
  const paidBreak = (settings.bezahltePause||0) * 60;
  const net = work + paidBreak;

  return {gross, brk, work, paidBreak, net, hasEntry:true, breakEligible};
}

// ---------- state / storage ----------
function weekKey(monday){ return WEEK_PREFIX + isoDate(monday); }

function loadSettings(){
  try{
    const stored = JSON.parse(localStorage.getItem(SETTINGS_KEY));
    return {...DEFAULT_SETTINGS, ...(stored||{})};
  }catch(e){ return {...DEFAULT_SETTINGS}; }
}
function saveSettings(s){
  localStorage.setItem(SETTINGS_KEY, JSON.stringify(s));
}
function loadWeek(monday){
  try{
    const raw = localStorage.getItem(weekKey(monday));
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return {days:[0,1,2,3,4,5,6].map(()=>({start:'',end:'',pause:false}))};
}
function saveWeek(monday, data){
  localStorage.setItem(weekKey(monday), JSON.stringify(data));
}
function effectiveSoll(data){
  return (data && data.soll !== undefined && data.soll !== null && !isNaN(data.soll)) ? Number(data.soll) : settings.soll;
}

function loadAbsences(){
  try{
    const raw = JSON.parse(localStorage.getItem(ABSENCES_KEY));
    if(Array.isArray(raw)) return raw;
  }catch(e){}
  return [];
}
function saveAbsences(list){
  localStorage.setItem(ABSENCES_KEY, JSON.stringify(list));
}

let settings = loadSettings();
let absences = loadAbsences();
let currentMonday = getMonday(new Date());
let weekData = loadWeek(currentMonday);
let urlaubYear = new Date().getFullYear();

// ---------- absence helpers (Urlaub / Zeitausgleich) ----------
function rangeDates(fromIso, toIso){
  const out = [];
  let d = new Date(fromIso + 'T00:00:00');
  const end = new Date(toIso + 'T00:00:00');
  if(isNaN(d) || isNaN(end) || d > end) return out;
  while(d <= end){
    out.push(new Date(d));
    d = addDays(d, 1);
  }
  return out;
}
function countWorkDaysInRange(fromIso, toIso){
  return rangeDates(fromIso, toIso).filter(d => weekdayIndex(d) !== 6).length; // Sonntag zählt nicht
}
function getAbsenceForDate(dateIso){
  return absences.find(a => a.from <= dateIso && dateIso <= a.to) || null;
}
function absenceDaysUsedInYear(year, type){
  let total = 0;
  const yStart = `${year}-01-01`, yEnd = `${year}-12-31`;
  absences.forEach(a => {
    if(a.type !== type) return;
    const from = a.from < yStart ? yStart : a.from;
    const to = a.to > yEnd ? yEnd : a.to;
    if(from > to) return;
    total += countWorkDaysInRange(from, to);
  });
  return total;
}

// ---------- weekly balance (Mo–Sa gegen Soll, Sonntag immer Überstunden) ----------
function computeWeekBalance(monday, data){
  const rawSoll = effectiveSoll(data);
  const dailyTarget = rawSoll / 6;
  let monSatNet = 0, sonntagNet = 0;
  let vacDays = 0, zaDays = 0;

  for(let i=0;i<7;i++){
    const d = addDays(monday, i);
    const dateIso = isoDate(d);
    const abs = getAbsenceForDate(dateIso);

    if(i === 6){ // Sonntag
      if(!abs){
        const calc = calcDay(data.days[i].start, data.days[i].end, data.days[i].pause);
        sonntagNet += calc.net;
      }
      continue;
    }
    if(abs){
      if(abs.type === 'urlaub') vacDays++; else zaDays++;
      continue; // Urlaub/ZA-Tag: neutral, kein Ist, kein Soll
    }
    const calc = calcDay(data.days[i].start, data.days[i].end, data.days[i].pause);
    monSatNet += calc.net;
  }

  const adjustedSollSec = Math.max(0, rawSoll - (vacDays+zaDays)*dailyTarget) * 3600;
  const diffSec = monSatNet - adjustedSollSec;
  return { rawSoll, dailyTarget, monSatNet, sonntagNet, vacDays, zaDays, adjustedSollSec, diffSec };
}

// ---------- Jahres-/Monatsstatistik (für Jahresrückblick & Überstunden) ----------
function computeStats(years){
  const yearSet = new Set(years);
  const stats = {};
  years.forEach(y => stats[y] = {
    monSatIst:0, monSatSoll:0, sonntagIst:0,
    months: Array.from({length:12}, () => ({monSatIst:0, monSatSoll:0, sonntagIst:0}))
  });

  const weeks = getAllRelevantWeeks();
  weeks.forEach(({monday, data}) => {
    const rawSoll = effectiveSoll(data);
    const dailyTarget = rawSoll / 6;

    for(let i=0;i<7;i++){
      const d = addDays(monday, i);
      const y = d.getFullYear();
      if(!yearSet.has(y)) continue;
      const s = stats[y];
      const m = s.months[d.getMonth()];
      const dateIso = isoDate(d);
      const abs = getAbsenceForDate(dateIso);

      if(i === 6){
        if(!abs){
          const calc = calcDay(data.days[i].start, data.days[i].end, data.days[i].pause);
          if(calc.hasEntry){ s.sonntagIst += calc.net; m.sonntagIst += calc.net; }
        }
        continue;
      }
      if(abs) continue;

      s.monSatSoll += dailyTarget*3600; m.monSatSoll += dailyTarget*3600;
      const calc = calcDay(data.days[i].start, data.days[i].end, data.days[i].pause);
      if(calc.hasEntry){ s.monSatIst += calc.net; m.monSatIst += calc.net; }
    }
  });

  return stats;
}

// ---------- ZA-Konto: kumulierte Überstunden über der Pauschale, minus genommener ZA-Tage ----------
function computeZaKonto(){
  const weeks = getAllRelevantWeeks();
  const pauschaleSec = (settings.pauschale||0) * 3600;
  let totalOverPauschale = 0;

  if(weeks.length > 0){
    let minYear = Infinity, maxYear = -Infinity;
    weeks.forEach(({monday}) => {
      minYear = Math.min(minYear, monday.getFullYear());
      maxYear = Math.max(maxYear, addDays(monday,6).getFullYear());
    });
    const allYears = [];
    for(let y=minYear;y<=maxYear;y++) allYears.push(y);
    const stats = computeStats(allYears);
    allYears.forEach(y => {
      stats[y].months.forEach(m => {
        const overtime = Math.max(0, m.monSatIst - m.monSatSoll) + m.sonntagIst;
        totalOverPauschale += Math.max(0, overtime - pauschaleSec);
      });
    });
  }

  let zaTakenSec = 0;
  absences.filter(a => a.type === 'za').forEach(a => {
    rangeDates(a.from, a.to).forEach(d => {
      if(weekdayIndex(d) === 6) return;
      const monday = getMonday(d);
      const data = loadWeek(monday);
      zaTakenSec += (effectiveSoll(data)/6) * 3600;
    });
  });

  return totalOverPauschale - zaTakenSec;
}

// ---------- today start/stop button ----------
const todayBtnEl = document.getElementById('todayBtn');
const todayLabelEl = document.getElementById('todayLabel');
const todaySubEl = document.getElementById('todaySub');
let todayTimer = null;

function getOpenEntry(){
  const today = new Date();
  const yesterday = addDays(today, -1);
  for(const d of [yesterday, today]){
    const monday = getMonday(d);
    const idx = weekdayIndex(d);
    const data = loadWeek(monday);
    const e = data.days[idx];
    if(e && e.start && !e.end){
      return {monday, index:idx, date:d, data};
    }
  }
  return null;
}

function startDay(){
  const today = new Date();
  const monday = getMonday(today);
  const idx = weekdayIndex(today);
  const data = loadWeek(monday);
  data.days[idx].start = nowTimeStr();
  saveWeek(monday, data);
  currentMonday = monday;
  weekData = data;
  render();
  renderToday();
}

function endDay(open){
  const data = loadWeek(open.monday);
  data.days[open.index].end = nowTimeStr();
  saveWeek(open.monday, data);
  currentMonday = open.monday;
  weekData = data;
  render();
  renderToday();
}

function renderToday(){
  if(todayTimer){ clearInterval(todayTimer); todayTimer = null; }
  todayBtnEl.disabled = false;

  const todayDate = new Date();
  const todayIso = isoDate(todayDate);
  const todayAbs = getAbsenceForDate(todayIso);
  const open = getOpenEntry();

  if(!open && todayAbs){
    const typeLabel = todayAbs.type === 'urlaub' ? '🌴 Urlaub' : '🔁 Zeitausgleich';
    todayLabelEl.textContent = `Heute: ${typeLabel} eingetragen`;
    todaySubEl.textContent = '';
    todayBtnEl.textContent = 'Kein Arbeitstag';
    todayBtnEl.className = 'today-btn secondary';
    todayBtnEl.disabled = true;
    todayBtnEl.onclick = null;
    return;
  }

  if(open){
    const dayLabel = isoDate(open.date) === todayIso ? 'Heute' : 'Gestern';
    todayLabelEl.textContent = `${dayLabel} gestartet um ${open.data.days[open.index].start} Uhr`;
    todayBtnEl.textContent = '⏹ Tag beenden';
    todayBtnEl.className = 'today-btn stop';
    todayBtnEl.onclick = () => endDay(open);

    const base = new Date(open.date);
    base.setHours(0,0,0,0);
    const startMs = base.getTime() + timeToSec(open.data.days[open.index].start) * 1000;
    const tick = () => {
      const elapsed = Math.max(0, Math.floor((Date.now() - startMs) / 1000));
      todaySubEl.textContent = secToHMS(elapsed);
    };
    tick();
    todayTimer = setInterval(tick, 1000);
  } else {
    const monday = getMonday(todayDate);
    const idx = weekdayIndex(todayDate);
    const data = loadWeek(monday);
    const e = data.days[idx];

    if(e && e.start && e.end){
      todayLabelEl.textContent = `Heute erfasst: ${e.start} – ${e.end} Uhr`;
      todaySubEl.textContent = '';
      todayBtnEl.textContent = '↻ Neu erfassen';
      todayBtnEl.className = 'today-btn secondary';
      todayBtnEl.onclick = () => {
        if(!confirm('Heutigen Eintrag wirklich zurücksetzen und neu starten?')) return;
        e.start = ''; e.end = ''; e.pause = false;
        saveWeek(monday, data);
        if(isoDate(currentMonday) === isoDate(monday)){ weekData = data; render(); }
        renderToday();
      };
    } else {
      todayLabelEl.textContent = 'Noch kein Eintrag für heute';
      todaySubEl.textContent = '';
      todayBtnEl.textContent = '▶ Tag starten';
      todayBtnEl.className = 'today-btn start';
      todayBtnEl.onclick = startDay;
    }
  }
}

function addAbsence(){
  const from = document.getElementById('absFrom').value;
  const to = document.getElementById('absTo').value;
  const type = document.getElementById('absType').value;
  const note = document.getElementById('absNote').value.trim();
  if(!from || !to){ alert('Bitte Von- und Bis-Datum angeben.'); return; }
  if(from > to){ alert('Das Bis-Datum muss nach dem Von-Datum liegen.'); return; }
  if(absences.some(a => a.from <= to && from <= a.to)){
    alert('Für diesen Zeitraum existiert bereits ein Eintrag.');
    return;
  }
  const id = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : (Date.now().toString(36)+Math.random().toString(36).slice(2));
  absences.push({ id, type, from, to, note });
  saveAbsences(absences);
  renderUrlaubView();
}

function renderUeberstundenView(){

  const approxDays = dailyTargetSec > 0 ? (kontoSec/dailyTargetSec) : 0;

  let hint;
  if(dailyTargetSec > 0 && kontoSec >= dailyTargetSec) hint = `Das reicht für ca. ${approxDays.toFixed(1)} Tage Zeitausgleich.`;

        <table class="month-table">
          <thead><tr><th>Monat</th><th>Diff. (Mo–Sa)</th><th>Sonntag</th><th>Über Pauschale</th></tr></thead>
          <tbody>${rows || '<tr><td colspan="4" class="empty-note">Keine Monatsdaten</td></tr>'}</tbody>
        </table>
      </details>
    `;
    el.appendChild(card);
  });

  el.querySelector('#pauschaleInput').addEventListener('input', (e) => {
    const v = parseFloat(e.target.value);
    settings.pauschale = isNaN(v) ? 0 : v;
    saveSettings(settings);
    renderUeberstundenView();
  });
}

// ---------- Jahresrückblick ----------
// Vereinigt gespeicherte Wochen mit Wochen, die nur einen Urlaub/ZA-Eintrag haben
// (sonst würde eine reine Urlaubswoche ohne je editierte Zeit in Monats-/Jahresstatistik fehlen)
function getAllRelevantWeeks(){
  const map = new Map();
  getAllWeeksFromStorage().forEach(w => map.set(isoDate(w.monday), w));
  absences.forEach(a => {
    rangeDates(a.from, a.to).forEach(d => {
      const monday = getMonday(d);
      const key = isoDate(monday);
      if(!map.has(key)) map.set(key, {monday, data: loadWeek(monday)});
    });
  });
  return Array.from(map.values());
}

function getAllWeeksFromStorage(){
  const weeks = [];
  for(let i=0;i<localStorage.length;i++){
    const key = localStorage.key(i);
    if(!key || !key.startsWith(WEEK_PREFIX)) continue;
    const dateStr = key.substring(WEEK_PREFIX.length);
    const monday = new Date(dateStr + 'T00:00:00');
    if(isNaN(monday)) continue;
    let data;
    try{ data = JSON.parse(localStorage.getItem(key)); }catch(e){ continue; }
    if(!data || !Array.isArray(data.days)) continue;
    weeks.push({monday, data});
  }
  return weeks;
}

function renderYearView(){
  const yearViewEl = document.getElementById('viewYear');
  const currentYear = new Date().getFullYear();
  const years = [currentYear, currentYear-1, currentYear-2];
  const stats = computeStats(years);

  yearViewEl.innerHTML = '';
  years.forEach(y => {
    const s = stats[y];
    const hasData = s.monSatSoll > 0 || s.sonntagIst > 0;
    const card = document.createElement('div');
    card.className = 'panel year-card';

    if(!hasData){
      card.innerHTML = `
        <div class="year-head"><span class="year-title">${y}${y===currentYear?'<span class="year-tag">aktuell</span>':''}</span></div>
        <p class="empty-note">Keine Daten für dieses Jahr erfasst.</p>`;
      yearViewEl.appendChild(card);
      return;
    }

    const diffSec = s.monSatIst - s.monSatSoll;
    let monthRows = '';
    s.months.forEach((m, idx) => {
      if(m.monSatSoll === 0 && m.monSatIst === 0 && m.sonntagIst === 0) return;
      const md = m.monSatIst - m.monSatSoll;
      monthRows += `<tr><td>${MONTH_NAMES[idx]}</td><td>${secToHMS(m.monSatIst)}</td><td>${secToHMS(m.monSatSoll)}</td><td class="${md>=0?'pos':'neg'}">${secToHMS(md,true)}</td></tr>`;
    });

    card.innerHTML = `
      <div class="year-head"><span class="year-title">${y}${y===currentYear?'<span class="year-tag">aktuell</span>':''}</span></div>
      <div class="summary">
        <div class="box"><div class="label">Soll (Mo–Sa)</div><div class="value">${secToHMS(s.monSatSoll)}</div></div>
        <div class="box"><div class="label">Ist (Mo–Sa)</div><div class="value">${secToHMS(s.monSatIst)}</div></div>
        <div class="box ${diffSec>=0?'diff-pos':'diff-neg'}"><div class="label">Differenz</div><div class="value">${secToHMS(diffSec,true)}</div></div>
      </div>
      ${s.sonntagIst>0 ? `<p class="empty-note" style="margin-top:10px;">+ ${secToHMS(s.sonntagIst)} Überstunden an Sonntagen (siehe Tab „Überstunden“)</p>` : ''}
      <details class="month-details">
        <summary>Monatsübersicht</summary>
        <table class="month-table">
          <thead><tr><th>Monat</th><th>Ist</th><th>Soll</th><th>Diff.</th></tr></thead>
          <tbody>${monthRows || '<tr><td colspan="4" class="empty-note">Keine Monatsdaten</td></tr>'}</tbody>
        </table>
      </details>
    `;
    yearViewEl.appendChild(card);
  });
}

// ---------- tabs ----------
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const tab = btn.dataset.tab;
    document.getElementById('viewWeek').style.display = tab === 'week' ? '' : 'none';
    document.getElementById('viewUeberstunden').style.display = tab === 'ueberstunden' ? '' : 'none';
    document.getElementById('viewUrlaub').style.display = tab === 'urlaub' ? '' : 'none';
    document.getElementById('viewYear').style.display = tab === 'year' ? '' : 'none';
    if(tab === 'week'){ render(); renderToday(); }
    else if(tab === 'ueberstunden') renderUeberstundenView();
    else if(tab === 'urlaub') renderUrlaubView();
    else if(tab === 'year') renderYearView();
  });
});

// ---------- backup (export / import) ----------
document.getElementById('exportBtn').addEventListener('click', () => {
  const backup = {version:2, exportedAt: new Date().toISOString(), settings, absences, weeks:{}};
  for(let i=0;i<localStorage.length;i++){
    const key = localStorage.key(i);
    if(key && key.startsWith(WEEK_PREFIX)){
      try{ backup.weeks[key] = JSON.parse(localStorage.getItem(key)); }catch(e){}
    }
  }
  const blob = new Blob([JSON.stringify(backup, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `stempeluhr-sicherung-${isoDate(new Date())}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
});

const importFileEl = document.getElementById('importFile');
document.getElementById('importBtn').addEventListener('click', () => importFileEl.click());
importFileEl.addEventListener('change', (e) => {
  const file = e.target.files[0];
  e.target.value = '';
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    let backup;
    try{ backup = JSON.parse(reader.result); }
    catch(err){ alert('Ungültige Sicherungsdatei.'); return; }
    if(!backup || typeof backup !== 'object' || typeof backup.weeks !== 'object'){
      alert('Ungültige Sicherungsdatei.');
      return;
    }
    if(!confirm('Bestehende lokale Daten werden durch diese Sicherung ersetzt. Fortfahren?')) return;

    Object.keys(localStorage)
      .filter(k => k.startsWith(WEEK_PREFIX) || k === SETTINGS_KEY || k === ABSENCES_KEY)
      .forEach(k => localStorage.removeItem(k));

    if(backup.settings) saveSettings(backup.settings);
    if(Array.isArray(backup.absences)) saveAbsences(backup.absences);
    Object.entries(backup.weeks).forEach(([key, value]) => {
      if(key.startsWith(WEEK_PREFIX)) localStorage.setItem(key, JSON.stringify(value));
    });

    settings = loadSettings();
    absences = loadAbsences();
    weekData = loadWeek(currentMonday);
    render();
    renderToday();
    if(document.getElementById('viewYear').style.display !== 'none') renderYearView();
    if(document.getElementById('viewUrlaub').style.display !== 'none') renderUrlaubView();
    if(document.getElementById('viewUeberstunden').style.display !== 'none') renderUeberstundenView();
    alert('Sicherung erfolgreich importiert.');
  };
  reader.readAsText(file);
});

render();
renderToday();
</script>
